<!-- Generated by npm run build:preview. -->
<!doctype html>
<html lang="en" data-local-preview data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Commonroom is a guest-friendly campus chat and issue board.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f9f6ff">
  <title>Commonroom preview</title>
  <link rel="stylesheet" href="./dist/commonroom/style.css">
  <link rel="stylesheet" href="./dist/commonroom/threads.css">
  <script defer src="./commonroom-preview.js"></script>
</head>
<body>
  <noscript>Enable JavaScript to try the Commonroom preview.</noscript>
  <section id="startup" class="startup" aria-labelledby="startup-title">
    <div class="startup-card glass">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 id="startup-title">Commonroom</h1>
      <p id="startup-status" role="status">Opening the student space…</p>
      <button id="startup-retry" class="primary" data-action="start" type="button" hidden>Try again</button>
    </div>
  </section>

  <div id="workspace" class="workspace glass" data-pane="chat" data-members="false" hidden>
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><strong>Commonroom</strong><small>Posts stay in this browser</small></span></div>
      <div class="masthead-right">
        <span id="guest-name" class="guest-chip"></span>
        <div id="connection" class="connection" role="status"><span id="connection-label">Connecting</span><button type="button" data-action="retry-connection" hidden>Retry</button></div>
      </div>
    </header>

    <nav class="mobile-nav" aria-label="Student space">
      <button type="button" data-action="global" aria-current="true"><span aria-hidden="true">⌂</span>Campus</button>
      <button type="button" data-action="classes"><span aria-hidden="true">▤</span>Classes</button>
      <button type="button" data-action="issues"><span aria-hidden="true">◇</span>Issues</button>
      <button type="button" data-action="help"><span aria-hidden="true">?</span>Help</button>
      <button type="button" data-action="people"><span aria-hidden="true">♙</span>People</button>
    </nav>

    <nav class="server-rail" aria-label="Spaces">
      <button class="rail-action" type="button" data-action="global" aria-label="Campus" title="Campus" aria-current="true">⌂</button>
      <button class="rail-action" type="button" data-action="classes" aria-label="Class rooms" title="Class rooms">▤</button>
      <button class="rail-action" type="button" data-action="issues" aria-label="Issue board" title="Issue board">◇</button>
      <button class="rail-action" type="button" data-action="help" aria-label="Help" title="Help">?</button>
    </nav>

    <aside class="rooms-panel" aria-label="Chat rooms">
      <header class="panel-heading"><h2 id="rooms-title" tabindex="-1">Chat rooms</h2></header>
      <nav id="channel-list" aria-label="Text channels"></nav>
      <div class="account"><span id="account-avatar" class="avatar avatar-indigo" aria-hidden="true"></span><span><strong id="account-name"></strong><small>Local guest</small></span></div>
    </aside>

    <main class="chat-panel" aria-label="Student conversation">
      <section id="conversation" class="conversation" aria-labelledby="channel-title">
        <header class="channel-heading">
          <span class="channel-mark" aria-hidden="true">#</span>
          <div class="channel-identity"><h1 id="channel-title" tabindex="-1">Global chat</h1><p id="channel-topic"></p></div>
          <button class="icon-button" type="button" data-action="search" aria-label="Search messages" title="Search messages">⌕</button>
          <button class="icon-button people-toggle" type="button" data-action="toggle-people" aria-label="Toggle member panel" aria-controls="people-panel" aria-expanded="false" title="Members">♙</button>
        </header>
        <div id="stream" class="stream" tabindex="0" aria-label="Message history">
          <button id="older-button" class="secondary older" type="button" data-action="older" hidden>Load older messages</button>
          <p id="messages-status" class="stream-status" role="status">Loading messages…</p>
          <ol id="messages" class="messages" aria-label="Messages"></ol>
        </div>
        <form id="composer" class="composer">
          <div id="reply-preview" class="reply-preview" hidden><span></span><button type="button" data-action="cancel-reply" aria-label="Cancel reply">×</button></div>
          <label class="sr-only" for="message-input">Message</label>
          <textarea id="message-input" name="text" rows="1" maxlength="2000" required placeholder="Write a message"></textarea>
          <button id="send-button" class="primary" type="submit">Send</button>
        </form>
      </section>
      <section id="thread-view" class="thread-view" aria-label="Issue board" hidden></section>
      <section id="help-view" class="thread-view" aria-label="Help board" hidden></section>
    </main>

    <aside id="people-panel" class="people-panel" aria-label="Space members">
      <header class="panel-heading"><h2 id="people-title" tabindex="-1">People in this space</h2><button class="icon-button people-toggle" type="button" data-action="toggle-people" aria-label="Close member panel">×</button></header>
      <ul id="member-list"></ul>
    </aside>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <header><h2 id="dialog-title"></h2><button class="icon-button" type="button" data-action="close-dialog" aria-label="Close dialog">×</button></header>
    <div id="dialog-content"></div>
    <p id="dialog-status" class="form-status" role="status"></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
